<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex" />
    <title>Back to HQ</title>
    <link rel="stylesheet" href="style.css" />
    <script>
      // Banks only send you back to an https page, and HQ runs on this
      // computer at http://localhost:3000. This page passes the bank's answer
      // straight on to HQ, always to localhost, and keeps nothing.
      if (/^\?[\w%=&.~+-]*$/.test(location.search)) {
        location.replace("http://localhost:3000/api/bank/callback" + location.search);
      }
    </script>
  </head>
  <body>
    <main>
      <p class="mark">HQ</p>
      <h1>Taking you back to HQ…</h1>
      <p>
        If nothing happens, make sure HQ is running on this computer, then start connecting again from its Finance page.
      </p>
    </main>
  </body>
</html>
